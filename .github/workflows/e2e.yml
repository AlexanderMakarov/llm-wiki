name: E2E

# Playwright + pytest-bdd end-to-end tests. Runs as a separate job
# so the slow browser install + real-page interactions never block
# the fast unit suite in `ci.yml`.
#
# Triggers:
# - Every PR that touches build.py, viz_*.py, project_topics.py, or
#   the tests/e2e/ directory (the surface the E2E tests exercise)
# - Every push to master (regression gate)
# - Manual workflow_dispatch for on-demand runs

on:
  push:
    branches: ["master", "main"]
    paths:
      - "llmwiki/build.py"
      - "llmwiki/viz_*.py"
      - "llmwiki/models_page.py"
      - "llmwiki/project_topics.py"
      - "llmwiki/changelog_timeline.py"
      - "tests/e2e/**"
      - "pyproject.toml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "llmwiki/build.py"
      - "llmwiki/viz_*.py"
      - "llmwiki/models_page.py"
      - "llmwiki/project_topics.py"
      - "llmwiki/changelog_timeline.py"
      - "tests/e2e/**"
      - "pyproject.toml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright + pytest-bdd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install llmwiki + the [e2e] extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[e2e]'

      # Cache must track the *installed* Playwright package version. Keying only
      # on pyproject.toml is wrong: `[e2e]` pins `pytest-playwright>=…` and pip
      # can resolve a newer `playwright` wheel that expects a different browser
      # revision (e.g. chromium_headless_shell-1234) while restore-keys still
      # serve an older ~/.cache/ms-playwright tree. On a stale hit we used to
      # skip `playwright install` and only run install-deps → 218 launch errors.
      - name: Resolve Playwright version for cache key
        id: pw-ver
        run: |
          python -c 'import importlib.metadata as m; print("version=" + m.version("playwright"))' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          # Playwright on Linux installs browsers under ~/.cache/ms-playwright
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-ver.outputs.version }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw-ver.outputs.version }}-

      - name: Install Chromium + OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Ensure Chromium matches installed Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          python -m playwright install-deps chromium
          # Idempotent: fills any revision the restored cache is missing
          # (including chromium-headless-shell after Playwright ≥1.49).
          python -m playwright install chromium

      - name: Run E2E suite
        run: |
          mkdir -p e2e-report
          python -m pytest tests/e2e/ \
            --browser=chromium \
            --tracing=retain-on-failure \
            --html=e2e-report/index.html \
            --self-contained-html \
            -v

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-html-report
          path: e2e-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
