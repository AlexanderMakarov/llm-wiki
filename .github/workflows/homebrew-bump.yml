name: Bump Homebrew formula

# After every version tag push, regenerate homebrew/llmwiki.rb against
# the new tag and print the formula. Push to a tap is intentionally
# disabled (#69): auto-pushing would collide with upstream
# Pratiyush/homebrew-tap, and this fork has no separate tap to publish
# into. Copy the printed formula by hand if you maintain a private tap.
# See docs/deploy/homebrew-setup.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to bump to (e.g. v1.1.0)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Refresh formula for new tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Regenerate formula
        run: |
          bash scripts/bump-homebrew-formula.sh "${{ steps.tag.outputs.tag }}"
          echo "---- homebrew/llmwiki.rb after bump ----"
          cat homebrew/llmwiki.rb
          echo "::notice::Tap push disabled (#69) — formula printed only; do not push to Pratiyush/homebrew-tap."
