name: Pages freshness

# Weekly guard against the failure mode in #213: the published demo site drifts
# behind the released package and nothing notices. `pages.yml` now republishes
# on every version tag, but a tag run can be skipped, cancelled, or reverted —
# this job asks the live site which version it serves and fails when that is not
# the `__version__` on the default branch.
#
# Read-only: it never deploys. A red run means "republish the demo" — see
# docs/deploy/github-pages.md and docs/uptime.md.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Live demo version matches main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `pip install` step: the checker reads `__version__` out of the
      # source tree, so it needs an interpreter and nothing else.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare the live demo with this tree
        run: |
          python3 scripts/check_live_version.py \
            --url https://alexandermakarov.github.io/llm-wiki/manifest.json \
            --attempts 3 --delay 20
