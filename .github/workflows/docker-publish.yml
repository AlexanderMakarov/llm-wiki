name: Docker — publish to GHCR

# Builds a multi-arch image (amd64 + arm64) on every tag push and
# publishes to GitHub Container Registry as
#   ghcr.io/<owner>/llm-wiki:<tag>
#   ghcr.io/<owner>/llm-wiki:latest    (tag pushes only)
#
# Image namespace follows `github.repository` so forks publish under
# their own GHCR namespace (#69). See docs/deploy/docker.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, as vMAJOR.MINOR.PATCH (e.g. v2.3.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write   # push to ghcr.io

jobs:
  build-and-push:
    name: Build + push multi-arch image
    runs-on: ubuntu-latest
    steps:
      # `vMAJOR.MINOR.PATCH` is the only release tag this project cuts, and
      # this step is the enforcement for both events: `on.push.tags` is a glob,
      # not a regex, so `v*.*.*` still admits `v2.4.0-rc1`. It is the first
      # step because everything downstream interpolates the tag: the checkout
      # below resolves it as a git ref, where a bad value fails with a far
      # blunter message than the `::error::` here, and `docker/metadata-action`
      # drops it into a `tags:` block scalar, where a newline would inject a
      # second `type=raw` row (e.g. a stray `type=raw,value=latest` moving
      # `latest` onto an old rebuild). It needs no working tree.
      - name: Validate the release tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$TAG' is not a release tag; expected vMAJOR.MINOR.PATCH."; exit 1; }

      - uses: actions/checkout@v7
        with:
          # Build the tag being rebuilt, not the branch the dispatch ran from
          # (#291). A `workflow_dispatch` ref is a branch, so the default
          # checkout would build `main` and publish it under the requested
          # tag. The dispatch ref is qualified as `refs/tags/…` because
          # `actions/checkout` resolves a bare name as a branch first, so a
          # branch sharing the tag's name would shadow it. The event test
          # matches the guard's above, so both answer "which tag is this run
          # about" the same way. On a tag push the fallback is `github.ref` —
          # the same *ref* checkout resolves with no `ref:` at all; the
          # default additionally pins `github.sha`, so a tag force-moved
          # between the push event and this step would now be re-resolved.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up QEMU (for arm64 emulation on amd64 runner)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Dispatch tagging (#211): a `workflow_dispatch` ref is a *branch*, so
          # the tag rows below never fire. Without the `type=raw` override row
          # a dispatch publishes nothing the smoke job could pull back.
          #   dispatch -> the requested tag only; rebuilding an old version
          #               must not move `latest`
          #   tag push -> that tag, its semver aliases, and `latest`
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope the buildx cache by what is being built, not by
          # `GITHUB_REF`: a dispatch runs from a branch, so an unscoped
          # rebuild would read and write that branch's cache while building
          # an old tag's source (near-zero hit rate, and it competes for the
          # per-repo cache cap). This wants the tag's *name*, so it is the
          # guard's expression rather than the checkout's `refs/tags/…` ref.
          cache-from: type=gha,scope=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  smoke-published-image:
    name: Smoke-test the published image
    needs: build-and-push
    runs-on: ubuntu-latest
    # Least privilege: this job only reads a package back, so it must not
    # inherit the workflow-level `packages: write`.
    permissions:
      contents: read
      packages: read
    steps:
      # A GHCR package is private until its first manual visibility flip, so
      # a fork's very first publish is not anonymously pullable.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published tag and run the CLI through it
        env:
          # Must resolve to a tag `build-and-push` actually published: the
          # required dispatch input, else the pushed git tag.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          expected="${TAG#v}"
          echo "Expecting '$image' to report version '$expected'."

          # GHCR can lag a few seconds behind the push, so bound a retry on
          # the pull only. Anything after this must stay red on failure.
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not pull $image after 5 attempts."
              exit 1
            fi
            echo "Pull failed (attempt $attempt/5); retrying in 15s."
            sleep 15
          done

          # ENTRYPOINT is `llmwiki`, and `version` prints exactly
          # "llmwiki <version>". Compare the whole line: a substring test
          # would let "1.2" pass against "llmwiki 1.20.0".
          # The guard step above admits only `vMAJOR.MINOR.PATCH`, so
          # `$expected` is always a full version the image can be held to.
          actual="$(docker run --rm "$image" version)"
          echo "Image reported: $actual"
          if [ "$actual" != "llmwiki $expected" ]; then
            echo "::error::Published image reported '$actual', expected exactly 'llmwiki $expected'."
            exit 1
          fi
