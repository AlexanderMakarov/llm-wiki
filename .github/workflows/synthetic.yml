name: Nightly synthetic

# Nightly Playwright run over the committed demo corpus, built and then
# opened as files exactly as a reader opens it. Catches breakage the unit
# suites cannot see: a corrupt build, browser-update breakage, a page that
# renders only when something answers requests for it.
#
# DISABLED (#69): kept on manual `workflow_dispatch` until the nightly
# cron is restored.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synthetic:
    name: Probe the built demo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install llmwiki + e2e extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[e2e]'

      - name: Install chromium + OS deps
        run: python -m playwright install --with-deps chromium

      - name: Walk the built demo and smoke the page types
        id: probe
        run: |
          # The walkthrough builds demo/ itself with the same fixed local
          # root as pages.yml, then opens every reader surface from disk.
          mkdir -p synthetic-report
          python -m pytest \
            tests/e2e/test_demo_walkthrough.py \
            tests/e2e/test_cross_browser_smoke.py \
            --browser=chromium \
            --tracing=retain-on-failure \
            --html=synthetic-report/index.html \
            --self-contained-html \
            -v

      - name: Upload synthetic HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-report
          path: synthetic-report/
          if-no-files-found: warn
          retention-days: 30

      - name: File or update tracking issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Synthetic monitoring failure"
          content-filepath: .github/synthetic-failure-template.md
          labels: bug, ci
          # Same dedupe as link-check.yml — append to the existing
          # tracking issue instead of spawning a new one each night.
          update_existing: true
