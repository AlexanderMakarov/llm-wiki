name: Nightly synthetic

# Nightly Playwright run against the deployed demo. Catches post-deploy
# breakage CI cannot see: Pages publish corruption, CDN issues, browser
# update breakage, broken third-party scripts.
#
# DISABLED (#69): this repo has no GitHub Pages demo, and the previous
# base URL pointed at upstream `pratiyush.github.io/llm-wiki`. Restore
# the cron below and set `QA_SYNTHETIC_BASE_URL` to our Pages URL once
# `pages.yml` is re-enabled (Settings → Pages → GitHub Actions).
# Manual `workflow_dispatch` kept for dry-runs after that.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synthetic:
    name: Probe deployed demo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install llmwiki + e2e extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[e2e]'

      - name: Install chromium + OS deps
        run: python -m playwright install --with-deps chromium

      - name: Run cross-browser smoke against the live demo
        id: probe
        run: |
          mkdir -p synthetic-report
          # Override base_url via env so the smoke probes the deployed
          # site instead of spinning up its own local server.
          # Set to this repo's Pages URL after pages.yml is live (#69).
          export QA_SYNTHETIC_BASE_URL="${QA_SYNTHETIC_BASE_URL:-https://alexandermakarov.github.io/llm-wiki}"
          python -m pytest tests/e2e/test_cross_browser_smoke.py \
            --base-url="$QA_SYNTHETIC_BASE_URL" \
            --browser=chromium \
            --tracing=retain-on-failure \
            --html=synthetic-report/index.html \
            --self-contained-html \
            -v

      - name: Upload synthetic HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report
          path: synthetic-report/
          if-no-files-found: warn
          retention-days: 30

      - name: File or update tracking issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Synthetic monitoring failure"
          content-filepath: .github/synthetic-failure-template.md
          labels: bug, ci
          # Same dedupe as link-check.yml — append to the existing
          # tracking issue instead of spawning a new one each night.
          update_existing: true
