name: Release to PyPI

# Triggered by pushing a version tag (e.g. v0.9.0, v1.0.0-rc1).
# Builds sdist + wheel, signs with Sigstore, publishes to PyPI via
# OIDC trusted publisher, and attaches artifacts to the GitHub Release.
#
# Prerequisites (one-time manual setup): see docs/deploy/pypi-publishing.md
# for the full walkthrough. TL;DR:
#   1. Register `llm-wiki-plus` on PyPI as a trusted publisher:
#      https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
#      Owner: AlexanderMakarov · Repo: llm-wiki · Workflow: release.yml · Env: release
#      Why that name: `llmwiki` is owned by another author, and PyPI's
#      name-similarity rule rejects `llm-wiki` as too close to it. The
#      distribution is `llm-wiki-plus`; the Python module and the CLI stay
#      `llmwiki`, the same way `pillow` installs `import PIL`.
#      (PyPI upload still gated on vars.PYPI_PUBLISHING=true — #69)
#   2. Create a GitHub environment called "release" (Settings > Environments).
#   3. Enable PyPI uploads: gh variable set PYPI_PUBLISHING --body "true"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create/update GitHub Release
  id-token: write   # OIDC token for PyPI trusted publishing + Sigstore

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    # Skip PyPI publish if the PYPI_PUBLISHING variable is not set to "true".
    # The gate is an escape hatch for a fork that has no trusted publisher, not
    # a normal state for this repo: the variable is set, so a skipped publish
    # here means someone turned releases off. When the gate is on, the `smoke`
    # job below fails the run if the upload didn't reach PyPI (#210).
    # Enable via: gh variable set PYPI_PUBLISHING --body "true"
    if: vars.PYPI_PUBLISHING == 'true'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via OIDC
        # #sec-17 (#561): SHA-pin so the publish step can't be hijacked
        # by a moved release/v1 branch. Bump deliberately after auditing
        # upstream changelog.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1

  smoke:
    name: Post-publish install smoke
    # `build` is in `needs` only so the `if` below can read its result — the
    # `needs` context carries direct dependencies only.
    needs: [build, publish]
    runs-on: ubuntu-latest
    # `needs: publish` on its own would make a *skipped* publish skip this job
    # too, which is exactly the silent-green path #210 exists to close. So the
    # job runs whenever the build produced artifacts and its first step fails
    # the run when publish didn't succeed. Deliberately no continue-on-error:
    # a tag that publishes something uninstallable — or installs a version
    # other than the one tagged — must turn the release workflow red.
    if: always() && needs.build.result == 'success'
    steps:
      - name: Fail when the publish gate is off
        run: |
          set -euo pipefail
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "ERROR: publish did not succeed (result: ${{ needs.publish.result }})." >&2
            echo "A tag that skips publish ships nothing to PyPI." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Need pyproject.toml so the install name comes from packaging, not a
      # second hardcoded string that can drift from DIST_NAME / pyproject.
      - uses: actions/checkout@v7

      - name: Install the published distribution from PyPI
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dist="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')"
          python -m venv /tmp/pypi-smoke
          # PyPI's CDN needs a moment to serve a just-uploaded release.
          for attempt in 1 2 3 4 5; do
            if /tmp/pypi-smoke/bin/pip install "${dist}==${version}"; then
              exit 0
            fi
            echo "attempt ${attempt}: ${dist}==${version} not installable yet"
            [ "$attempt" -lt 5 ] && sleep 30
          done
          echo "ERROR: ${dist}==${version} could not be installed from PyPI." >&2
          echo "The tag was pushed but the release never reached users." >&2
          exit 1

      - name: Assert the CLI reports the tagged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          reported="$(/tmp/pypi-smoke/bin/llmwiki --version)"
          echo "llmwiki --version -> ${reported}"
          # The CLI prints "llmwiki <version>". Normalise both sides the same
          # way so the comparison can't fail on spacing or letter case alone.
          normalise() { printf '%s' "$1" | tr -cd '0-9a-zA-Z.' | tr 'A-Z' 'a-z'; }
          if [ "$(normalise "$reported")" != "$(normalise "llmwiki${version}")" ]; then
            echo "ERROR: expected version ${version}, got '${reported}'." >&2
            exit 1
          fi

  sign:
    name: Sign with Sigstore
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: >-
            dist/*.tar.gz
            dist/*.whl

      - name: Upload signature bundles
        uses: actions/upload-artifact@v7
        with:
          name: sigstore-signatures
          path: dist/*.sigstore.json
          if-no-files-found: warn

  github-release:
    name: Create GitHub Release
    needs: [build, sign]
    # Run even if publish or sign was skipped/failed — GitHub Release shouldn't
    # depend on PyPI upload or Sigstore signing succeeding.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          # Pre-release if tag contains rc, alpha, beta, dev
          prerelease=""
          if echo "$tag" | grep -qiE '(rc|alpha|beta|dev)'; then
            prerelease="--prerelease"
          fi

          # Collect artifacts — missing dirs/files are tolerated.
          assets=()
          for f in artifacts/dist/* artifacts/sigstore-signatures/*.sigstore.json; do
            if [ -f "$f" ]; then
              assets+=("$f")
            fi
          done

          # If a release already exists for this tag (e.g. created manually
          # for v0.9.1-v0.9.3), upload assets to it; otherwise create it.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading ${#assets[@]} asset(s)"
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          else
            echo "Creating release $tag with ${#assets[@]} asset(s)"
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              $prerelease \
              "${assets[@]}"
          fi
