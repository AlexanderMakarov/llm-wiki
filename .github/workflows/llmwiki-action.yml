# Reusable GitHub Action workflow for llmwiki.
#
# Other repositories can call this with:
#
#   jobs:
#     wiki:
#       uses: AlexanderMakarov/llm-wiki/.github/workflows/llmwiki-action.yml@main
#       with:
#         python-version: "3.12"
#         sync-args: "--adapter claude-code"
#         build-args: "--out site"

name: llmwiki reusable workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      vault:
        description: >-
          Vault directory for init/sync/build relative to the workspace root.
          Defaults to `.`. Pass a subdirectory when the workspace is the
          llmwiki source tree (refused as a vault).
        required: false
        type: string
        default: "."
      sync-args:
        description: "Extra arguments passed to `llmwiki sync`"
        required: false
        type: string
        default: ""
      build-args:
        description: "Extra arguments passed to `llmwiki build`"
        required: false
        type: string
        default: ""
    outputs:
      site-dir:
        description: "Path to the generated site directory"
        value: ${{ jobs.build.outputs.site-dir }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site-dir: ${{ steps.paths.outputs.site-dir }}

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install llmwiki
        run: pip install llm-wiki-plus

      # Same as action.yml: an installed llmwiki needs an explicit vault (#210).
      - name: Initialise directory structure
        env:
          VAULT: ${{ inputs.vault }}
        run: llmwiki init --vault "$VAULT"

      - name: Sync sessions
        env:
          VAULT: ${{ inputs.vault }}
        run: llmwiki sync --vault "$VAULT" ${{ inputs.sync-args }}

      - name: Build static site
        env:
          VAULT: ${{ inputs.vault }}
        run: llmwiki build --vault "$VAULT" ${{ inputs.build-args }}

      - name: Expose output paths
        id: paths
        env:
          VAULT: ${{ inputs.vault }}
        run: |
          site_dir="$(cd "$VAULT" && pwd)/site"
          echo "site-dir=${site_dir}" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: llmwiki-site
          path: ${{ inputs.vault }}/site/
