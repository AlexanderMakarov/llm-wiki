name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install required deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown
          python -m pip install ruff pytest

      - name: Ruff lint
        run: ruff check llmwiki tests scripts

      - name: CLI smoke tests
        # The checkout carries .llmwiki-source-checkout, so vault-writing
        # commands require an explicit --vault (#109). Scaffold a scratch one.
        run: |
          python -m llmwiki --version
          python -m llmwiki adapters
          python -m llmwiki init --vault ./ci-vault

      - name: Build smoke test with fixtures
        run: |
          python -m llmwiki build --vault demo --out ./ci-site || true
          test -f ./ci-site/style.css || echo "build produced no output (no fixtures yet — this is ok in v0.1)"

      - name: Run pytest
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            python -m pytest tests/ -q
          else
            echo "no tests yet — skipping"
          fi

      - name: Working tree clean after tests
        run: |
          # #91 backstop: a test that rewrites a tracked file can launder
          # gitignored local data into a committed one (reindex rebuilds a
          # tracked index from every page on disk). --exit-code looks at
          # tracked files only, so untracked build artifacts are fine.
          if ! git diff --exit-code --stat; then
            echo "ERROR: the test suite modified tracked files (diff above)." >&2
            echo "Tests must write only into tmp_path. A code path whose" >&2
            echo "wiki_dir or state file falls back to the repo root will" >&2
            echo "rewrite the clone — pass an explicit directory instead." >&2
            exit 1
          fi

      - name: Case-insensitive path collisions (should return zero hits)
        run: |
          set -euo pipefail
          # #160 guard: two tracked paths differing only in case (e.g.
          # llmwiki.md / LLMWiki.md) coexist fine on case-sensitive Linux but
          # collide on case-insensitive filesystems (macOS default, Windows).
          # Run the single pytest definition of this check (Unicode-aware
          # str.lower() fold) rather than a separate ASCII-only shell
          # pipeline, so the two guards cannot disagree at the edges.
          python -m pytest tests/test_case_insensitive_paths.py -q

      - name: Privacy grep (should return zero hits)
        run: |
          # Never commit the real username; the test fixtures use USER as placeholder
          if grep -rn "deepshikhasingh" --include="*.md" --include="*.py" --exclude-dir=".temp" --exclude-dir=".framework" --exclude-dir=".git" .; then
            echo "ERROR: real username leaked into committed files" >&2
            exit 1
          fi

  performance-budget:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install markdown

      - name: Build the demo vault (when present)
        run: |
          if [ -d demo/raw/sessions ]; then
            time python -m llmwiki build --vault demo --out ./perf-site
            if [ ! -d ./perf-site ]; then
              echo "ERROR: build produced no output directory" >&2
              exit 1
            fi
            # Budget: build under 15 seconds, site under 50 MB
            SIZE=$(du -sb ./perf-site | cut -f1)
            MB=$((SIZE / 1024 / 1024))
            echo "site size: ${MB} MB"
            if [ "$MB" -gt 50 ]; then
              echo "ERROR: site size ${MB} MB exceeds 50 MB budget" >&2
              exit 1
            fi
          else
            echo "no demo vault yet — skipping perf budget check"
          fi
