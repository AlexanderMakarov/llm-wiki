name: Deploy demo site to GitHub Pages

# Builds the public demo site from the committed `demo/` vault (no personal
# data) and publishes it to GitHub Pages. Highlight.js loads client-side from
# CDN so no extra deps.
#
# `demo/` carries its own `raw/`, `wiki/` and `usage/` trees, so the build is a
# single command with nothing to seed. Auto push-deploy stays off (#69); use
# workflow_dispatch (or restore `push:` once you want every main merge to
# republish). See docs/deploy/github-pages.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install markdown

      - name: Build demo site
        run: python -m llmwiki build --vault demo --out ./site

      - name: Ensure .nojekyll for Pages
        run: touch ./site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
