name: Deploy demo site to GitHub Pages

# Builds the public demo site from the committed `demo/` vault (no personal
# data) and publishes it to GitHub Pages. Every script and stylesheet the site
# loads is emitted into the output, so there is nothing to fetch at view time.
#
# `demo/` carries its own `raw/`, `wiki/` and `usage/` trees, so the build is a
# single command with nothing to seed.
#
# Triggers: every version tag republishes, plus manual workflow_dispatch (#213).
# Deploying only on dispatch left the live site four releases behind the
# package — nobody remembers to press a button. Auto-deploy on every push to
# main stays off (#69): the demo tracks releases, not merges. See
# docs/deploy/github-pages.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install markdown

      - name: Build demo site
        # --local-root fixes the path shown in place of a session's stored
        # home directory, so the published pages never carry the runner's own.
        run: python -m llmwiki build --vault demo --out ./site --local-root /home/user

      - name: Ensure .nojekyll for Pages
        run: touch ./site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A green deploy job only proves the artifact was accepted, not that the
      # site now serves it — the stale demo in #213 lived behind green runs.
      # The build stamps `site/manifest.json` with `llmwiki.__version__`, so
      # reading it back is the one check that says which build is live.
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Compares against `__version__` in the commit that was just published,
      # so a tag push and a manual dispatch assert exactly the same thing.
      # `page_url` ends with "/"; the script appends manifest.json. Retries
      # cover the CDN's propagation window.
      - name: Assert the live site serves this version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_live_version.py --url "$PAGE_URL" --attempts 6 --delay 15
