name: Agnix

# Lints shipped agent kit + inner maintainer agent surfaces (not full-repo demo).
# Pinned CLI: https://www.npmjs.com/package/agnix — see docs/maintainers/AGNIX.md

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  AGNIX_VERSION: "0.56.5"

jobs:
  validate:
    name: Agent config lint (agnix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate shipped agent kit
        run: npx --yes agnix@${AGNIX_VERSION} --format github validate llmwiki/agent_kit

      - name: Validate inner .claude tooling
        # Layer A wrappers under commands/awos/ `@`-import repo-root `.awos/`
        # (agnix REF-001 resolves those from the wrapper dir — false positive).
        # Agnix 0.56.5 does not honor `[files].exclude` when the parent directory
        # is an explicit validate path; this glob is the real guard.
        run: |
          npx --yes agnix@${AGNIX_VERSION} --format github validate \
            .claude/skills \
            .claude/agents \
            .claude/commands/*.md
