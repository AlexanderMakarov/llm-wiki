name: Wiki checks

# Runs llmwiki lint + build against demo/ on PRs and pushes to verify
# still produces valid output. Seeded from the committed demo/ vault so CI
# never touches personal data.

on:
  push:
    branches: ["main"]
    paths:
      - "llmwiki/**"
      - "demo/**"
      - ".github/workflows/wiki-checks.yml"
  pull_request:
    paths:
      - "llmwiki/**"
      - "demo/**"
      - ".github/workflows/wiki-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-checks:
    name: Lint + build the demo vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install llmwiki
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: llmwiki lint (errors fail the build)
        run: |
          # Errors fail; warnings are printed and tolerated. --strict is
          # deliberately not used: content_freshness fires on any committed
          # vault once 90 days pass, so it would redden this job on a timer
          # rather than on a defect.
          python -m llmwiki lint --vault demo --fail-on-errors || {
            echo "::error::llmwiki lint found errors in demo/. Review output above."
            exit 1
          }

      - name: llmwiki build (smoke test)
        run: |
          # --local-root keeps the output identical on any machine.
          python -m llmwiki build --vault demo --out /tmp/site-test --local-root /home/user
          # Verify output exists
          test -f /tmp/site-test/index.html || {
            echo "::error::build did not produce index.html"
            exit 1
          }
          echo "Build produced $(find /tmp/site-test -name '*.html' | wc -l) HTML files"

      - name: llmwiki adapters (dry-run listing)
        run: |
          # Verify the adapter registry still enumerates correctly.
          python -m llmwiki adapters
