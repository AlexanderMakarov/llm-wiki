name: Wiki checks

# Runs llmwiki lint + build against demo/ on PRs and pushes to verify
# still produces valid output. Seeded from the committed demo/ vault so CI
# never touches personal data.

on:
  push:
    branches: ["main"]
    paths:
      - "llmwiki/**"
      - "demo/**"
      - "docs/**"
      - "scripts/refresh_demo.py"
      - ".github/workflows/wiki-checks.yml"
  pull_request:
    paths:
      - "llmwiki/**"
      - "demo/**"
      - "docs/**"
      - "scripts/refresh_demo.py"
      - ".github/workflows/wiki-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-checks:
    name: Lint + build the demo vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install llmwiki
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: llmwiki lint (errors and warnings fail the build)
        run: |
          # Errors and warnings both fail. Enforcing warnings is only honest
          # because demo/llmwiki.json switches off content_freshness — it
          # fires on any committed vault once 90 days pass, so it would
          # redden this job on a calendar date rather than on a defect. That
          # is the demo's one opt-out; every other check runs at stock
          # settings, and the report below names what was skipped.
          python -m llmwiki lint --vault demo --fail-on-errors --fail-on-warnings || {
            echo "::error::llmwiki lint found errors or warnings in demo/. Review output above."
            exit 1
          }

      - name: llmwiki build (smoke test)
        run: |
          # --local-root keeps the output identical on any machine.
          python -m llmwiki build --vault demo --out /tmp/site-test --local-root /home/user
          # Verify output exists
          test -f /tmp/site-test/index.html || {
            echo "::error::build did not produce index.html"
            exit 1
          }
          echo "Build produced $(find /tmp/site-test -name '*.html' | wc -l) HTML files"

      - name: llmwiki adapters (dry-run listing)
        run: |
          # Verify the adapter registry still enumerates correctly.
          python -m llmwiki adapters

      - name: Demo refresh plan (no model)
        run: |
          # Local-only refresh must never run here. If a recorded revision
          # exists, print the dry-run plan so a docs change that was not
          # followed by a local refresh is visible. No synth, no vault write.
          if [ -f demo/.demo-source-rev ]; then
            python3 scripts/refresh_demo.py --dry-run
          else
            echo "demo/.demo-source-rev is not committed — skip staleness preview"
          fi
