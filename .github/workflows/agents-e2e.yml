name: Playwright Test Agents (TS)

on:
  pull_request:
    paths:
      - "llmwiki/build.py"
      - "llmwiki/render/**"
      - "tests/agents/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - "llmwiki/build.py"
      - "llmwiki/render/**"
      - "tests/agents/**"
      - "playwright.config.ts"

permissions:
  contents: read

jobs:
  agents-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python deps
        run: pip install -e .

      - name: Install Node deps
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Build the demo site
        run: |
          # Build the committed demo/ vault into ./site (mirrors pages.yml).
          python3 -m llmwiki build --vault demo --out ./site --local-root /home/user

      - name: Serve site in the background
        run: |
          # Playwright drives the site over HTTP; llmwiki itself ships no
          # server, so a stdlib one stands in front of the built files.
          # bash -e aborts on the first failing curl unless we gate it with `if`.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start" >&2
          exit 1

      - name: Run Playwright Test Agents
        run: npx playwright test
        env:
          LLMWIKI_BASE_URL: http://127.0.0.1:8765

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agents-html-report
          path: playwright-report
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agents-traces
          path: test-results
          retention-days: 14
