name: Playwright Test Agents (TS)

on:
  pull_request:
    paths:
      - "llmwiki/build.py"
      - "llmwiki/render/**"
      - "tests/agents/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - "llmwiki/build.py"
      - "llmwiki/render/**"
      - "tests/agents/**"
      - "playwright.config.ts"

permissions:
  contents: read

jobs:
  agents-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python deps
        run: pip install -e .

      - name: Install Node deps
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Build the demo site
        run: |
          # Build the committed demo/ vault into ./site (mirrors pages.yml).
          python3 -m llmwiki build --vault demo --out ./site --local-root /home/user

      - name: Run Playwright Test Agents
        run: npx playwright test
        env:
          # The specs open the built files; nothing is served.
          LLMWIKI_SITE_DIR: ${{ github.workspace }}/site

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agents-html-report
          path: playwright-report
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agents-traces
          path: test-results
          retention-days: 14
