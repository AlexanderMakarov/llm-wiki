[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "1.5.0"
description = "Karpathy-style LLM wiki from your Claude Code, Codex CLI, Cursor, and Obsidian sessions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexander Makarov", email = "4ellendger@gmail.com" },
    { name = "Pratiyush", email = "pratiyush1@gmail.com" },
]
keywords = [
    "llm-wiki",
    "karpathy",
    "knowledge-base",
    "claude-code",
    "codex-cli",
    "cursor",
    "obsidian",
    "session-history",
    "static-site",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Natural Language :: English",
]
dependencies = [
    "markdown>=3.9",
]

[project.optional-dependencies]
# `highlight` is kept as an empty alias for v0.4 users who wrote
# `pip install -e '.[highlight]'` in docs or CI scripts. v0.5+ uses
# highlight.js via CDN, so no Python-side highlighter dep is needed.
highlight = []
# Simplification sweep removed the PDF adapter; the [pdf] extra is
# dropped here too. Don't reintroduce — the user pruned it deliberately.
graph = ["graphifyy>=0.4.20"]
# `llmwiki add` quality upgrades (#16): trafilatura is pullmd's base
# extraction library (static HTML → markdown); markitdown converts
# PDF/docx/pptx/xlsx/epub. markitdown gates each format converter behind
# its own extra, so a bare `markitdown` cannot read the formats this
# extra advertises — keep the bracket list in sync with _MARKITDOWN_EXT
# in llmwiki/add_doc.py. The stdlib fallback keeps a bare install
# working without either. (This is NOT the old [pdf] extra — that one
# stays removed.)
add = [
    "trafilatura>=2.0.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.2",
]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.11",
]
# E2E test harness — Playwright drives a real browser + pytest-bdd
# turns Gherkin `.feature` files into pytest scenarios + pytest-html
# produces a browseable HTML report per run. Opt-in because
# Playwright installs ~300 MB of browsers per engine.
# Install with: `pip install -e '.[e2e]'` then `playwright install chromium`
e2e = [
    "pytest>=8.4.2",
    "pytest-playwright>=0.7.1",
    "pytest-bdd>=8.1.0",
    "pytest-html>=4.2.0",
    # Pillow powers the image-diff used by tests/e2e/test_visual_regression.py.
    # Without it the visual regression scenario falls back to capture-only mode
    # (a warning, not a failure) so the suite still works on minimal installs.
    "Pillow>=10.0",
]
all = [
    "graphifyy>=0.4.20",
]

[project.urls]
Homepage = "https://github.com/AlexanderMakarov/llm-wiki"
Documentation = "https://github.com/AlexanderMakarov/llm-wiki/tree/main/docs"
Repository = "https://github.com/AlexanderMakarov/llm-wiki"
Issues = "https://github.com/AlexanderMakarov/llm-wiki/issues"
Changelog = "https://github.com/AlexanderMakarov/llm-wiki/blob/main/CHANGELOG.md"
Releases = "https://github.com/AlexanderMakarov/llm-wiki/releases"

[project.scripts]
llmwiki = "llmwiki.cli:main"
llm-wiki-add = "llmwiki.cli:main_add"

[tool.setuptools.packages.find]
include = ["llmwiki*"]

[tool.setuptools.package-data]
llmwiki = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "PLC0415",  # import-outside-top-level
]
ignore = [
    "E501",  # line too long — we have long strings for CSS/JS
    "E402",  # module-level import not at top — legacy; prefer PLC0415 policy for new code
]

[tool.ruff.lint.per-file-ignores]
# One-off maintenance scripts are not importable library code; deferred imports there cost nothing (#58).
"scripts/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --ignore tests/e2e keeps the fast unit + integration suite unaware
# of the Playwright + pytest-bdd harness. Run E2E explicitly:
#   pytest tests/e2e/ --no-header -p no:cacheprovider
addopts = "-q --ignore=tests/e2e"
# #429: register custom markers so pytest doesn't warn on @pytest.mark.slow.
# `slow` flags wall-clock perf-budget tests in test_lint_perf.py.
markers = [
    "slow: marks tests as slow (perf-budget, deselect with '-m \"not slow\"')",
]
