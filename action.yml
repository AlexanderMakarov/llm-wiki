# Composite GitHub Action for *other* repositories (not a workflow).
# Must live at the repo root as `action.yml` (or under `.github/actions/<name>/`)
# so consumers can `uses: AlexanderMakarov/llm-wiki@v2`. Files under
# `.github/workflows/` are workflows that *run* in this repo; they cannot be
# referenced that way. See https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
#
#   - uses: AlexanderMakarov/llm-wiki@v2
#     with:
#       python-version: "3.12"
#       additional-args: "--adapter claude-code"
#
# The PyPI distribution is `llm-wiki-plus`; the CLI it installs is `llmwiki`.

name: llm-wiki
author: AlexanderMakarov
description: Build an LLM wiki from your AI coding sessions

branding:
  icon: book-open
  color: purple

inputs:
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.12"
  package:
    description: >-
      pip requirement to install. Defaults to the published distribution;
      set it to a path (e.g. `.`) to test an unreleased checkout.
    required: false
    default: "llm-wiki-plus"
  additional-args:
    description: "Extra arguments forwarded to `llmwiki sync`"
    required: false
    default: ""

outputs:
  site-dir:
    description: "Absolute path to the generated site/ directory"
    value: ${{ steps.paths.outputs.site-dir }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install llmwiki
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pip install "$PACKAGE"

    # An installed llmwiki resolves an unnamed vault to the directory above the
    # package — site-packages — so the bare commands used to scaffold and build
    # inside the interpreter instead of the checkout, and `site-dir` pointed at
    # a directory that was never created (#210). `--vault .` pins every step to
    # the workspace the caller checked out.
    - name: Initialise directory structure
      shell: bash
      run: llmwiki init --vault .

    - name: Sync sessions
      shell: bash
      env:
        ADDITIONAL_ARGS: ${{ inputs.additional-args }}
      run: |
        # additional-args is a flag list, so it has to split into separate
        # arguments — read it into an array rather than interpolating the
        # input into the command line, where it would also be glob-expanded.
        read -r -a extra_args <<< "$ADDITIONAL_ARGS"
        llmwiki sync --vault . "${extra_args[@]}"

    - name: Build static site
      shell: bash
      run: llmwiki build --vault .

    - name: Expose output paths
      id: paths
      shell: bash
      run: echo "site-dir=$(pwd)/site" >> "$GITHUB_OUTPUT"
