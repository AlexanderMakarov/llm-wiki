# Composite GitHub Action for *other* repositories (not a workflow).
# Must live at the repo root as `action.yml` (or under `.github/actions/<name>/`)
# so consumers can `uses: AlexanderMakarov/llm-wiki@v2`. Files under
# `.github/workflows/` are workflows that *run* in this repo; they cannot be
# referenced that way. See https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
#
#   - uses: AlexanderMakarov/llm-wiki@v2
#     with:
#       python-version: "3.12"
#       additional-args: "--adapter claude-code"
#
# The PyPI distribution is `llm-wiki-plus`; the CLI it installs is `llmwiki`.

name: llm-wiki
author: AlexanderMakarov
description: Build an LLM wiki from your AI coding sessions

branding:
  icon: book-open
  color: purple

inputs:
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.12"
  package:
    description: >-
      pip requirement to install. Defaults to the published distribution;
      set it to a path (e.g. `.`) to test an unreleased checkout.
    required: false
    default: "llm-wiki-plus"
  vault:
    description: >-
      Vault directory for init/sync/build relative to the workspace root.
      Defaults to `.` (the caller's checkout). When exercising this action
      against the llmwiki source tree itself, pass a subdirectory such as
      `action-vault` — the checkout root carries `.llmwiki-source-checkout`
      and is refused as a vault.
    required: false
    default: "."
  additional-args:
    description: >-
      Extra arguments forwarded to `llmwiki sync`. `sync` keeps real home
      paths in raw/ by default; repositories that commit raw/ (especially
      on self-hosted runners) must set `redaction.redact_username: true`
      in the vault's config.json.
    required: false
    default: ""

outputs:
  site-dir:
    description: "Absolute path to the generated site/ directory"
    value: ${{ steps.paths.outputs.site-dir }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install llmwiki
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pip install "$PACKAGE"

    # An installed llmwiki requires an explicit vault (`--vault` or
    # vault.default_path). Bare commands used to write into site-packages
    # (#210). Default `vault: .` pins every step to the caller's checkout;
    # name a subdirectory when the workspace is the llmwiki source tree.
    - name: Initialise directory structure
      shell: bash
      env:
        VAULT: ${{ inputs.vault }}
      run: llmwiki init --vault "$VAULT"

    - name: Sync sessions
      shell: bash
      env:
        ADDITIONAL_ARGS: ${{ inputs.additional-args }}
        VAULT: ${{ inputs.vault }}
      run: |
        # additional-args is a flag list, so it has to split into separate
        # arguments — read it into an array rather than interpolating the
        # input into the command line, where it would also be glob-expanded.
        read -r -a extra_args <<< "$ADDITIONAL_ARGS"
        llmwiki sync --vault "$VAULT" "${extra_args[@]}"

    - name: Build static site
      shell: bash
      env:
        VAULT: ${{ inputs.vault }}
      run: llmwiki build --vault "$VAULT"

    - name: Expose output paths
      id: paths
      shell: bash
      env:
        VAULT: ${{ inputs.vault }}
      run: |
        site_dir="$(cd "$VAULT" && pwd)/site"
        echo "site-dir=${site_dir}" >> "$GITHUB_OUTPUT"
